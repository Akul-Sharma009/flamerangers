# One sentence per problem code, caution, label and standing note.
# The web shows these words and types none of its own. Keys under `labels`
# are the contract's enum names in snake_case, and every enum value has an entry
# (contract/test_contract.py checks this).
#
# Results and figures (for example how the conversion did in a region) are NOT
# here. They come from evidence/claims.yaml and evidence.json, so that no result
# is typed twice. Hotspots are never called "fires".
version: 0.4.0

problems:
  invalid_aoi: "This area can't be used. Check that the coordinates are in range, in order and form a closed shape."
  no_land: "There is no land in this area."
  outside_coverage: "This area is not loaded yet."
  too_large_for_sync: "This download is large. You can download it one year at a time."
  version_superseded: "The record has been updated since this page loaded. Reloading with the new version."
  rate_limited: "Too many requests. Please wait a moment and try again."

cautions:
  scale_below_1deg: "This area is smaller than a 1° box. The conversion was tested on 1° cells and whole regions, so treat counts for an area this small with care."
  scale_below_025deg: "This area is smaller than a 0.25° box, the finest scale the conversion was tested at. Counts for an area this small are not supported by the tests."

labels:
  flag_state:
    strong: "Flagged, strong: at least 1.5 times the cell's threshold."
    marginal: "Flagged, marginal: above the cell's threshold, below 1.5 times it."
    none: "Not flagged."
    not_flaggable: "Not flaggable: fewer than 10 hotspots."
    outside_record: "Outside the record."
  partial_reason:
    record_start: "The record starts partway through this month (July 2002)."
    data_through: "Month to date: data runs only to the data-through date."
    missing_days: "Some days of input data are missing in this month."
    range_cut: "Your date range cuts this month. The count shown is for the whole month."
  null_reason:
    outside_record: "Outside the record."
    outside_coverage: "Not loaded yet."
  source:
    aqua_real: "Aqua MODIS hotspots, as detected."
    viirs_converted: "VIIRS hotspots converted to Aqua MODIS units."
  quality:
    SP: "Standard quality."
    NRT: "Near real time. These counts can change when standard-quality data replaces them."
  evidence_class:
    tuned: "Inside a region the conversion was tuned on."
    tested_unseen: "Inside a region the conversion was tested on but not tuned on."
    reported_only: "Inside a region with reported-only results, which were not used to choose the method."
    not_evaluated: "Outside every evaluated region. The conversion is untested here."
  region_caveat:
    none: ""
    untuned_region: "Part of this area is outside the regions the conversion was tuned on."
    southern_africa: "This area overlaps the southern African savanna region, where the conversion was tested but not tuned."
  satellite:
    AQUA: "Aqua (MODIS)"
    TERRA: "Terra (MODIS)"
    SNPP: "Suomi NPP (VIIRS)"
    NOAA20: "NOAA-20 (VIIRS)"
    NOAA21: "NOAA-21 (VIIRS)"
  excluded_reason:
    none: "Counted."
    offshore: "Not counted: offshore."
    static: "Not counted: a persistent heat source such as a gas flare or volcano."
  day_night:
    D: "Day"
    N: "Night"
  coverage_status:
    loaded: "Loaded."
    not_loaded: "Not loaded yet."

notes:
  placeholder: "Placeholder data. These numbers are invented and will be replaced by the real record."
  hotspot_definition: "A hotspot is one satellite detection of heat. Hotspot counts measure burning activity, not the number of burns."
  record_switch: "Sensor change: Aqua MODIS counts through December 2021, converted VIIRS counts from January 2022, on one scale."
  satellite_switch: "From 3 November 2026 the record is fed by NOAA-20, because Suomi NPP stopped on 2 November 2026."
  validated_satellite_false: "The satellite feeding this month was not part of the validation."
  after_pick_years: "This month is outside the years used to choose the conversion method."
  year_incomplete: "Incomplete year: the total covers only the months the record holds so far."
  monthly_validation_only: "The conversion was validated on whole months only, not on part of a month."
  no_typical_activity: "No typical activity in this month."
  strong_tier: "The strong tier is a display tier. It was checked on selection years only and is not part of the scored flag rule."
  flag_scale: "Flags are set on whole 1° cells, never on an area's total."
  reference_year: "Reference years: this month is one of the years that set the flag thresholds."
  provisional: "Provisional: this month is not complete, so its flags may change."
  noaa20_check: "Reported only. This compares converted NOAA-20 counts with converted Suomi NPP counts and is not a validation against Aqua."
  noaa20_check_not_run: "The NOAA-20 comparison has not been run yet."
  range_and_reference: "Rankings cover the dates you chose. Medians and anomalies always use the reference period."
  month_complete: "Complete month: every day of input data is in."
  partly_inside: "Partly inside the area. The count and flag are for the whole cell."
  rank_tie: "An equals sign after a rank means the rank is shared: those values are equal."
  no_complete_month: "No complete month falls in these dates, so none is ranked."
  no_complete_year: "No complete year falls in these dates, so none is ranked."
  missing_days_to_date: "Some days of input data are missing so far this month, so the count to date may be low."


# The six limits that apply to every count, whatever the area or month. The
# about-the-data page lists them and both CSV headers write one
# `counting_limits` line each, in this order (0.4.0).
counting_limits:
  - "Hotspot location files carry no cloud or missing-data information, and do not remove detections duplicated by overlapping orbits, so where passes overlap the same burning can be counted twice."
  - "Confidence values are not comparable between sensors, which is one reason no confidence filter is applied."
  - "The day/night flag is set differently in near-real-time data (by the direction of the orbit) and in standard data (by the sun's angle). This site works out day and night from the sun's position for every hotspot."
  - "Terra and Aqua are drifting from their orbits, which is one reason the record switch sits after December 2021."
  - "Early VIIRS data, in 2012 and 2013, had bad scans. The validation reported those years only and never used them to choose the method."
  - "No cropland region was used to tune or choose the method. Punjab, where crop residue is burned, was scored as reported only. So the evidence for small crop burns is weaker."
# Card sentences with {placeholders}. The service fills no words; the web fills
# each placeholder with a served value, formatted only (0.4.0).
sentences:
  current_month: "So far this month: {count} hotspots, {ratio}× the {reference_start}–{reference_end} median for the same days of {month_name}."
  current_month_count: "So far this month: {count} hotspots."
  current_month_usual: "Usual = the {reference_start}–{reference_end} median for days 1 to {day} of {month_name}: {median} hotspots. This month differs by {difference}. Data through {data_through}."
  cells_flagged: "{strong} of {total} one-degree cells are flagged strong and {marginal} marginal, a caution and not an alarm."
  ruler_caption: "Days 1 to {day} of {month_name} in each year from {reference_start} to {reference_end}."
  record_high: "The highest month on record here is {month}, with {count} hotspots."
  noaa20_compared: "From {period_start} to {period_end}, converted NOAA-20 counts differed from converted Suomi NPP counts by {bias_pct}% overall, with a mean absolute difference of {mean_abs_difference} per one-degree cell-month."
  anomaly: "Difference from the {reference_start}–{reference_end} mean for {month_name}: {anomaly_count} hotspots ({anomaly_pct}%)."
  reference_mean: "The {reference_start}–{reference_end} mean for {month_name} is {mean} hotspots."
  flag_reference: "Flag thresholds come from {flag_start}–{flag_end}, a different period from the mean, so a large anomaly can have no flag and a flag can come with a small anomaly."
  anomaly_scale: "Anomaly as a percentage of the {reference_start}–{reference_end} mean for the calendar month. Each class starts at the value shown."
  cells_heading: "Flag state of each one-degree cell in {month}."
  rankings_range: "Only complete months and years from {range_start} to {range_end} are ranked."

# States the web finds itself, before or instead of a service answer. The
# service never sends these; they are here so the web types no words (0.3.0; date sentences 0.4.0).
client:
  coordinates_out_of_range: "A longitude must be between -180 and 180, and a latitude between -90 and 90."
  latitude_out_of_order: "The south edge must be less than the north edge."
  polygon_not_closed: "The last vertex must repeat the first, so the shape is closed."
  service_unreachable: "The service could not be reached. Please try again in a moment."
  evidence_unavailable: "The evidence could not be loaded. Please reload the page."
  date_unreadable: "Enter each date as a day, month and year."
  date_before_record: "The record starts in July 2002. Choose a later first date."
  date_after_data_through: "The record runs only to the data-through date. Choose an earlier last date."
  dates_out_of_order: "The first date must be on or before the last date."
