      - {name: "4A precision in southern Africa", display: "0.473", format: fix3, source: {file: final, pointer: "/approaches/4A/1/regions/southern_africa/flags/precision"}}
      - {name: "1A precision in southern Africa", display: "0.408", format: fix3, source: {file: final, pointer: "/approaches/1A/1/regions/southern_africa/flags/precision"}}
