# Fixed claims (Story 5.1). The UI, README and pitch use these sentences and no others
# about how C1 scored. Never write that C1 "beat the baselines" or had lower error than
# "every baseline".
#
# Each figure gives the number as the sentence shows it (`display`) and where it comes
# from (`source`: a file in evidence/scoring/ and an RFC 6901 JSON pointer). No value is
# typed here: the evidence build (Story 5.2) reads each value from its source, formats it
# with `format`, and fails if the result differs from `display`.
#
# Formats:
#   pct1      value x 100, one decimal, then "%"        (0.2787 -> "27.9%")
#   pct1_abs  as pct1, of the absolute value            (-0.1675 -> "16.8%")
#   fix3      three decimals                            (0.7044 -> "0.704")
#   fix3_abs  as fix3, of the absolute value            (-0.0084 -> "0.008")
#   fix2      two decimals                              (45.497 -> "45.50")
#   bool      a true/false in the file; `expect` is the value the sentence relies on,
#             and `display` is not quoted in the text
#   string    a string in the file, equal to `expect`
# An `_abs` figure also gives `sign` (negative or positive), which the text relies on
# ("ran 16.8% low", "0.008 lower precision").
# A figure with `interval` also reads the 95% interval's `lo` and `hi` (same format).
#
# Names used in the text: (a) the raw splice, (b) one global factor, (c) Aqua only.
# "Beyond noise" means the paired 95% interval excludes zero (the scoring files'
# `beyond_noise` field).

version: 1

files:
  final: final_20261113T172020Z.json
  reported_only: reported_only_20261113T205827Z.json

claims:
  - id: count-error-vs-b
    used_for_pick: true
    text: >-
      C1 has 27.9% lower count error than one global factor, baseline (b), on the final
      set, 95% interval 18.6% to 30.5%, beyond noise. It also passed against the raw
      splice, baseline (a). Baseline (c), Aqua only, is not scored on count error.
    figures:
      - name: error reduction, C1 against (b), final set
        display: "27.9%"
        format: pct1
        source: {file: final, pointer: "/comparisons/C1 vs b/error/diff"}
        interval:
          display: "18.6% to 30.5%"
          lo: {file: final, pointer: "/comparisons/C1 vs b/error/lo"}
          hi: {file: final, pointer: "/comparisons/C1 vs b/error/hi"}
        beyond_noise: {file: final, pointer: "/comparisons/C1 vs b/error/beyond_noise"}
      - name: C1 passed the test against (a), final set
        display: "true"
        format: bool
        expect: true
        source: {file: final, pointer: "/decisions/final/beats_a/C1/pass"}

  - id: flag-precision-vs-b
    used_for_pick: true
    text: >-
      C1 failed the flag-precision test against (b): 0.704 against 0.736. Under the rule
      fixed beforehand the outcome was "nothing beat one global factor", and the project
      lead kept C1 as a recorded deviation after seeing the scores.
    figures:
      - name: C1 flag precision, final set
        display: "0.704"
        format: fix3
        source: {file: final, pointer: "/approaches/C1/1/pooled/flags/precision"}
      - name: (b) flag precision, final set
        display: "0.736"
        format: fix3
        source: {file: final, pointer: "/approaches/b/1/pooled/flags/precision"}
      - name: precision difference C1 minus (b) is beyond noise
        display: "true"
        format: bool
        expect: true
        source: {file: final, pointer: "/comparisons/C1 vs b/precision/beyond_noise"}
      - name: C1 passed the test against (b), final set
        display: "false"
        format: bool
        expect: false
        source: {file: final, pointer: "/decisions/final/beats_b/C1/pass"}

  - id: trade-off-recall
    used_for_pick: true
    text: >-
      The trade-off: on the final set C1's flags caught more of the true anomalies than
      (b)'s (recall 0.761 against 0.690) and were right less often. In plain words, more
      true alerts and more false alarms.
    figures:
      - name: C1 flag recall, final set
        display: "0.761"
        format: fix3
        source: {file: final, pointer: "/approaches/C1/1/pooled/flags/recall"}
      - name: (b) flag recall, final set
        display: "0.690"
        format: fix3
        source: {file: final, pointer: "/approaches/b/1/pooled/flags/recall"}

  - id: best-of-three
    used_for_pick: true
    text: >-
      The final-set score is slightly optimistic because C1 is the best of three.
    figures:
      - name: lowest-error approach of the three scored on the final set
        display: "C1"
        format: string
        expect: "C1"
        source: {file: final, pointer: "/decisions/not used for the pick/best_single/best"}

  - id: comparator-vs-b
    used_for_pick: false
    # The region-month comparator was shown beside the candidates and never eligible
    # for the pick (planning record, selection rule). Added in Story 6.6.
    text: >-
      On the final set, the region-month comparator, one factor per region and calendar
      month that was never eligible for the pick, passed the test against (b): 10.3% lower
      count error, 95% interval 4.1% to 10.8%, and higher flag precision (0.756 against
      0.736). C1 has 18.4% lower count error than the comparator, 95% interval 8.2% to
      22.8%, and lower flag precision (0.704 against 0.756), both beyond noise.
    figures:
      - name: comparator passed the test against (b), final set
        display: "true"
        format: bool
        expect: true
        source: {file: final, pointer: "/decisions/not used for the pick/beats_b/cmp/pass"}
      - name: error reduction, comparator against (b), final set
        display: "10.3%"
        format: pct1
        source: {file: final, pointer: "/comparisons/cmp vs b/error/diff"}
        interval:
          display: "4.1% to 10.8%"
          lo: {file: final, pointer: "/comparisons/cmp vs b/error/lo"}
          hi: {file: final, pointer: "/comparisons/cmp vs b/error/hi"}
        beyond_noise: {file: final, pointer: "/comparisons/cmp vs b/error/beyond_noise"}
      - {name: "comparator flag precision, final set", display: "0.756", format: fix3, source: {file: final, pointer: "/approaches/cmp/1/pooled/flags/precision"}}
      - {name: "(b) flag precision, final set", display: "0.736", format: fix3, source: {file: final, pointer: "/approaches/b/1/pooled/flags/precision"}}
      - {name: "comparator minus (b) precision is beyond noise", display: "true", format: bool, expect: true, source: {file: final, pointer: "/comparisons/cmp vs b/precision/beyond_noise"}}
      - name: error reduction, C1 against the comparator, final set
        display: "18.4%"
        format: pct1
        source: {file: final, pointer: "/comparisons/C1 vs cmp/error/diff"}
        interval:
          display: "8.2% to 22.8%"
          lo: {file: final, pointer: "/comparisons/C1 vs cmp/error/lo"}
          hi: {file: final, pointer: "/comparisons/C1 vs cmp/error/hi"}
        beyond_noise: {file: final, pointer: "/comparisons/C1 vs cmp/error/beyond_noise"}
      - {name: "C1 flag precision, final set", display: "0.704", format: fix3, source: {file: final, pointer: "/approaches/C1/1/pooled/flags/precision"}}
      - {name: "C1 minus the comparator precision is beyond noise", display: "true", format: bool, expect: true, source: {file: final, pointer: "/comparisons/C1 vs cmp/precision/beyond_noise"}}

  - id: margin-vs-4a
    used_for_pick: true
    # The margin test is the combination rule fixed before scoring: a combination must
    # beat the best single approach by the fixed margin, or the simpler one wins. The
    # margin's size is stated in the planning record, not in the scoring file, so the
    # sentence does not quote it. Added in Story 6.6.
    text: >-
      On the final set C1 had 3.9% lower count error than 4A, 95% interval 1.7% to 5.8%,
      short of the margin fixed beforehand, so under that rule the simpler 4A was
      preferred; 4A also failed the flag-precision test against (b).
    figures:
      - name: error reduction, C1 against 4A, final set
        display: "3.9%"
        format: pct1
        source: {file: final, pointer: "/comparisons/C1 vs 4A/error/diff"}
        interval:
          display: "1.7% to 5.8%"
          lo: {file: final, pointer: "/comparisons/C1 vs 4A/error/lo"}
          hi: {file: final, pointer: "/comparisons/C1 vs 4A/error/hi"}
        beyond_noise: {file: final, pointer: "/comparisons/C1 vs 4A/error/beyond_noise"}
      - {name: "C1 passed the margin against 4A", display: "false", format: bool, expect: false, source: {file: final, pointer: "/decisions/final/margin/pass"}}
      - {name: "C1's error was not lower by the margin", display: "false", format: bool, expect: false, source: {file: final, pointer: "/decisions/final/margin/checks/error_at_least_5pct_lower"}}
      - {name: "the single approach the margin was tested against", display: "4A", format: string, expect: "4A", source: {file: final, pointer: "/decisions/final/margin/single"}}
      - {name: "4A passed the test against (b), final set", display: "false", format: bool, expect: false, source: {file: final, pointer: "/decisions/final/beats_b/4A/pass"}}

