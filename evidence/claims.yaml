      - {name: "(b) against (c)", display: "false", format: bool, expect: false, source: {file: final, pointer: "/decisions/not used for the pick/non_inferior_to_c/b/pass"}}
      - {name: "comparator against (c)", display: "false", format: bool, expect: false, source: {file: final, pointer: "/decisions/not used for the pick/non_inferior_to_c/cmp/pass"}}
      - {name: "4A against (c)", display: "false", format: bool, expect: false, source: {file: final, pointer: "/decisions/not used for the pick/non_inferior_to_c/4A/pass"}}
      - {name: "1A against (c)", display: "false", format: bool, expect: false, source: {file: final, pointer: "/decisions/not used for the pick/non_inferior_to_c/1A/pass"}}
      - {name: "C1 against (c)", display: "false", format: bool, expect: false, source: {file: final, pointer: "/decisions/not used for the pick/non_inferior_to_c/C1/pass"}}

